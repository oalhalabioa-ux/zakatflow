name: ZATCA Cryptography QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/fixtures/zatca-phase2-ledger.sql'
      - 'tests/zatca-ledger-postgres.py'
      - 'tests/fixtures/zatca-source-freeze*.sql'
      - 'tests/zatca-source-freeze-postgres.py'
      - 'tests/fixtures/zatca-signer-registry.sql'
      - 'tests/zatca-signer-registry-postgres.py'
      - 'tests/zatca-source-freeze-permissions-postgres.py'
      - 'tests/sql/zatca-phase2-qa-compatibility.sql'
      - 'lib/zatca*'
      - 'services/zatca-phase2-access*'
      - 'services/auth.ts'
      - 'services/organization-access.ts'
      - 'lib/supabase/server.ts'
      - 'lib/vat-einvoice-draft*'
      - 'lib/vat-zatca-csr*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/zatca-cryptography-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zatca-cryptography-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-xml-signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install independent XML signature verifier
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1
      - run: npm run typecheck
      - name: Verify prepared signatures and tamper rejection
        run: npx vitest run services/zatca-phase2-access.test.ts lib/zatca-reserved-preparation.test.ts lib/zatca-phase2-qr.test.ts lib/zatca-sdk-validation.test.ts lib/zatca-xades-preparation.test.ts lib/zatca-signing-certificate.test.ts lib/zatca-xml-hash.test.ts lib/zatca-kms-signer.test.ts lib/zatca-phase2-xml.test.ts lib/vat-einvoice-draft.test.ts lib/vat-zatca-csr.test.ts
        env:
          ZATCA_NATIVE_XMLSEC: '1'

  ledger-storage-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.18
        env:
          POSTGRES_PASSWORD: disposable-qa-only
          POSTGRES_DB: zatca_ledger_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client and independent signature verifier
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client xmlsec1
      - name: Verify isolated ledger transactions and simultaneous requests
        run: python3 tests/zatca-ledger-postgres.py
        env:
          ZATCA_LEDGER_DISPOSABLE_QA: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: zatca_ledger_qa
          PGPASSWORD: disposable-qa-only
      - name: Verify atomic source freeze and authorization races
        run: python3 tests/zatca-source-freeze-postgres.py
        env:
          ZATCA_LEDGER_DISPOSABLE_QA: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: zatca_ledger_qa
          PGPASSWORD: disposable-qa-only
      - name: Verify pinned signer registry, rotation and finalization races
        run: python3 tests/zatca-signer-registry-postgres.py
        env:
          ZATCA_LEDGER_DISPOSABLE_QA: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: zatca_ledger_qa
          PGPASSWORD: disposable-qa-only
      - name: Verify saved reservation to signed artifact and next chain entry
        run: npx vitest run lib/zatca-reserved-preparation.test.ts lib/zatca-xades-preparation.test.ts
        env:
          ZATCA_LEDGER_SQL_QA: '1'
          ZATCA_SOURCE_FREEZE_QA: '1'
          ZATCA_NATIVE_XMLSEC: '1'
          ZATCA_LEDGER_DISPOSABLE_QA: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: zatca_ledger_qa
          PGPASSWORD: disposable-qa-only
      - name: Verify private boolean lookup and application-role isolation
        run: python3 tests/zatca-source-freeze-permissions-postgres.py
        env:
          ZATCA_LEDGER_DISPOSABLE_QA: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: zatca_ledger_qa
          PGPASSWORD: disposable-qa-only
