name: Feasibility isolated QA

on:
  pull_request:
    branches: [main, qa/feasibility-release-candidate-20261116]
    paths:
      - 'lib/feasibility/**'
      - 'components/feasibility/**'
      - 'components/FeasibilityWorkspace.tsx'
      - 'app/api/feasibility/**'
      - 'app/[locale]/feasibility/**'
      - 'docs/feasibility/**'
      - 'supabase/migrations/*_feasibility_phase1_*.sql'
      - 'tests/feasibility/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/feasibility-isolated-qa.yml'

permissions:
  contents: read

concurrency:
  group: feasibility-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feasibility-pure-and-api-tests:
    # This workflow must not run privileged tests or access production secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR merge source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no application secrets)
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Standalone engine, draft, access, and API route tests
        run: npx vitest run lib/feasibility
      - name: Rehearse the feasibility schema, row policies, and snapshot restore
        run: |
          rehearsal_dir="$(mktemp -d)"
          npm install --prefix "$rehearsal_dir" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.14
          FEASIBILITY_PGLITE_MODULE="$rehearsal_dir/node_modules/@electric-sql/pglite/dist/index.js" \
            node tests/feasibility/phase1-migration-rehearsal.mjs
