name: Operational Integration V1 VAT QA Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-operational-integration-vat-qa:
    name: Run VAT operational QA harness
    runs-on: ubuntu-latest
    environment: financial-core-qa
    env:
      QA_BRANCH: feature/operational-integration-v1-vat
      SUPABASE_URL: https://wtzgzmcgcqouziqzsfnl.supabase.co
      SUPABASE_PROJECT_REF: wtzgzmcgcqouziqzsfnl
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_REQUIRE_CONFIG: 'true'

    steps:
      - name: Checkout VAT QA branch
        uses: actions/checkout@v4
        with:
          ref: feature/operational-integration-v1-vat
          persist-credentials: false

      - name: Verify QA target and tested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$QA_BRANCH" = "feature/operational-integration-v1-vat"
          test "$SUPABASE_PROJECT_REF" = "wtzgzmcgcqouziqzsfnl"
          test "$SUPABASE_URL" = "https://wtzgzmcgcqouziqzsfnl.supabase.co"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$E2E_OWNER_EMAIL"
          test -n "$E2E_OWNER_PASSWORD"
          test -n "$E2E_ADMIN_EMAIL"
          test -n "$E2E_ADMIN_PASSWORD"
          echo "Testing VAT QA commit: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run authenticated VAT operational harness
        shell: bash
        run: |
          set -euo pipefail
          NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY" \
          npx vitest run tests/operational-integration-v1-vat.e2e.test.ts

      - name: Install browser E2E runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start QA application
        shell: bash
        run: |
          NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY" \
          npm run dev -- --hostname 127.0.0.1 > /tmp/zakatflow-vat-e2e.log 2>&1 &
          echo $! > /tmp/zakatflow-vat-e2e.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/en/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/zakatflow-vat-e2e.log
          exit 1

      - name: Run VAT purchase browser E2E
        shell: bash
        run: |
          set -euo pipefail
          NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY" \
          E2E_APP_URL="http://127.0.0.1:3000" \
          npx playwright test tests/operational-integration-v1-vat.browser.spec.ts --workers=1
