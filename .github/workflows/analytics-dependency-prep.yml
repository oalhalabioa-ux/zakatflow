name: Analytics dependency preparation
on:
  push:
    branches:
      - feat/visitor-analytics-qa-20261102
    paths:
      - .github/workflows/analytics-dependency-prep.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare official dependency without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund '@vercel/analytics@latest'
      - name: Validate lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vercel-analytics-dependency-files
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated dependency manifests to this feature branch only
        if: github.ref == 'refs/heads/feat/visitor-analytics-qa-20261102' && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: add verified Vercel Analytics dependency and lockfile'
            git fetch origin feat/visitor-analytics-qa-20261102
            git rebase origin/feat/visitor-analytics-qa-20261102
            git push origin HEAD:refs/heads/feat/visitor-analytics-qa-20261102
          fi
