name: Analytics dependency preparation
on:
  push:
    branches:
      - feat/visitor-analytics-qa-20261102
    paths:
      - .github/workflows/analytics-dependency-prep.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare official dependency without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund '@vercel/analytics@latest'
      - name: Validate lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vercel-analytics-dependency-files
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
