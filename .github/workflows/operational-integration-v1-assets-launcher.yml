name: Operational Integration V1 Assets QA Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets-operational-qa:
    runs-on: ubuntu-latest
    environment: financial-core-qa
    env:
      QA_BRANCH: feature/operational-integration-v1-assets
      SUPABASE_URL: https://wtzgzmcgcqouziqzsfnl.supabase.co
      SUPABASE_PROJECT_REF: wtzgzmcgcqouziqzsfnl
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
    steps:
      - name: Checkout Assets QA branch
        uses: actions/checkout@v4
        with:
          ref: feature/operational-integration-v1-assets
          persist-credentials: false
      - name: Verify QA target
        shell: bash
        run: |
          set -euo pipefail
          test "$QA_BRANCH" = "feature/operational-integration-v1-assets"
          test "$SUPABASE_PROJECT_REF" = "wtzgzmcgcqouziqzsfnl"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$E2E_OWNER_EMAIL"
          test -n "$E2E_OWNER_PASSWORD"
          echo "Testing Assets QA commit: $(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Run authenticated Assets operational harness
        run: npx vitest run tests/operational-integration-v1-assets.e2e.test.ts
