name: Loan table presentation QA
on:
  pull_request:
    paths:
      - 'components/LoansWorkspace.tsx'
      - 'components/FinancingLoansTable.tsx'
      - 'components/financing-loans-table.css'
      - 'lib/table-sort*'
      - 'tests/loan-table/**'
      - '.github/workflows/loan-table-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Install temporary browser tools
        run: |
          mkdir -p "$RUNNER_TEMP/loan-table-tools"
          npm install --prefix "$RUNNER_TEMP/loan-table-tools" --no-save --package-lock=false playwright@1.64.1 esbuild@0.25.12
          node "$RUNNER_TEMP/loan-table-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "LOAN_TABLE_ESBUILD_MODULE=$RUNNER_TEMP/loan-table-tools/node_modules/esbuild/lib/main.js" >> "$GITHUB_ENV"
          echo "LOAN_TABLE_BROWSER_MODULE=$RUNNER_TEMP/loan-table-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Exercise real React table without any database connection
        run: node tests/loan-table/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loan-table-review
          path: |
            tests/loan-table/screenshots/*.png
            tests/loan-table/result.json
