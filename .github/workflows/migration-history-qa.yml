name: Canonical migration history acceptance
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migration-history.json'
      - 'tests/migration-history/**'
      - 'tests/sql/personal-sale*.sql'
      - '.github/workflows/migration-history-qa.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migration-history.json'
      - 'tests/migration-history/**'
      - 'tests/sql/personal-sale*.sql'
      - '.github/workflows/migration-history-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node tests/migration-history/verify-files.mjs
      - name: Initialize disposable local migration target
        run: |
          export HISTORY_QA_WORKDIR="$RUNNER_TEMP/migration-history-qa"
          echo "HISTORY_QA_WORKDIR=$HISTORY_QA_WORKDIR" >> "$GITHUB_ENV"
          mkdir -p "$HISTORY_QA_WORKDIR"
          npx --yes supabase@2.122.0 init --workdir "$HISTORY_QA_WORKDIR"
          python - <<'PY'
          import os,pathlib,re,shutil
          root=pathlib.Path(os.environ['HISTORY_QA_WORKDIR'])/'supabase'
          p=root/'config.toml';s=p.read_text()
          s=re.sub(r'^project_id = .*$', 'project_id = "migration-history-qa"',s,flags=re.M)
          p.write_text(s)
          shutil.copytree('supabase/migrations',root/'migrations',dirs_exist_ok=True)
          PY
      - name: Apply complete canonical history to empty local Supabase
        run: npx --yes supabase@2.122.0 start --workdir "$HISTORY_QA_WORKDIR" --exclude studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta > "$RUNNER_TEMP/history-start.log" 2>&1 || { tail -60 "$RUNNER_TEMP/history-start.log"; exit 1; }
      - name: Compare full schema and exercise actual financial authorization
        run: node tests/migration-history/bootstrap.mjs
      - name: Exercise personal sale correction in an authenticated Chromium session
        run: |
          npm install --prefix "$RUNNER_TEMP/history-browser" --no-save --package-lock=false playwright@1.64.1
          node "$RUNNER_TEMP/history-browser/node_modules/playwright/cli.js" install --with-deps chromium
          HISTORY_BROWSER_MODULE="$RUNNER_TEMP/history-browser/node_modules/playwright/index.mjs" node tests/migration-history/personal-sale-browser.mjs
      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-history-acceptance
          path: |
            tests/migration-history/bootstrap-result.json
            tests/migration-history/schema-differences.json
      - name: Destroy disposable database
        if: always()
        run: test -z "$HISTORY_QA_WORKDIR" || npx --yes supabase@2.122.0 stop --workdir "$HISTORY_QA_WORKDIR" --no-backup
  work02-after-personal-fx:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start the released baseline with the recorded personal FX version
        run: |
          export WORK02_UPGRADE_DIR="$RUNNER_TEMP/work02-after-personal-fx"
          echo "WORK02_UPGRADE_DIR=$WORK02_UPGRADE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$WORK02_UPGRADE_DIR"
          npx --yes supabase@2.122.0 init --workdir "$WORK02_UPGRADE_DIR"
          python - <<'PY'
          import os,pathlib,re,shutil
          root=pathlib.Path(os.environ['WORK02_UPGRADE_DIR'])/'supabase'
          config=root/'config.toml'
          config.write_text(re.sub(r'^project_id = .*$', 'project_id = "work02-after-personal-fx"',config.read_text(),flags=re.M))
          shutil.copytree('supabase/migrations',root/'migrations',dirs_exist_ok=True)
          migrations=root/'migrations'
          (migrations/'20261126124000_atomic_chart_template.sql').unlink()
          (migrations/'20261126124100_fiscal_reversal_window.sql').unlink()
          # Issue #426 records the provider version for the same reviewed SQL.
          (migrations/'20261125165000_personal_fx_rates.sql').rename(migrations/'20261125201134_personal_fx_rates.sql')
          PY
          npx --yes supabase@2.122.0 start --workdir "$WORK02_UPGRADE_DIR" --exclude studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta > "$RUNNER_TEMP/work02-baseline.log" 2>&1 || { tail -60 "$RUNNER_TEMP/work02-baseline.log"; exit 1; }
      - name: Apply only the two Work 02 migrations and reconcile the existing records
        run: node tests/migration-history/upgrade-work02-after-fx.mjs
      - name: Publish upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work02-after-personal-fx
          path: tests/migration-history/work02-upgrade-result.json
      - name: Destroy disposable upgrade target
        if: always()
        run: test -z "$WORK02_UPGRADE_DIR" || npx --yes supabase@2.122.0 stop --workdir "$WORK02_UPGRADE_DIR" --no-backup
