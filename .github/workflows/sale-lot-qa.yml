name: Sale lot isolated PostgreSQL QA
on:
  pull_request:
    paths:
      - 'supabase/modules/assets/**'
      - 'supabase/release/personal-gold-sales/**'
      - 'supabase/migrations/*_personal_gold_lot_sales.sql'
      - 'tests/sql/personal-gold-lot-sale.sql'
      - '.github/workflows/sale-lot-qa.yml'
permissions:
  contents: read
jobs:
  full-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize a disposable Supabase database
        run: |
          root="$RUNNER_TEMP/lot-sale-db"
          mkdir -p "$root"
          npx --yes supabase@2.122.0 init --workdir "$root"
          mkdir -p "$root/supabase/migrations"
          cp -a supabase/migrations/. "$root/supabase/migrations/"
          npx --yes supabase@2.122.0 start --workdir "$root" --exclude studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Rehearse canonical release and non-destructive rollback
        run: |
          export PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres PGHOST=127.0.0.1 PGPORT=54322
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/personal-gold-release-disabled.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/release/personal-gold-sales/enable.sql -f tests/sql/personal-gold-lot-sale.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/release/personal-gold-sales/disable.sql -f tests/sql/personal-gold-release-disabled.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/personal-sale-price-preflight.sql
