name: Opening workspace full-schema acceptance
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'app/api/financial-reporting/**'
      - 'app/api/liquidity/**'
      - 'components/LiquidityWorkspace.tsx'
      - 'tests/qa-cash-account-link-sync.sql'
      - 'tests/qa-bank-opening-correction.sql'
      - 'components/BankAccountDetails.tsx'
      - 'components/CashFlowSourceDetails.tsx'
      - 'app/[locale]/cash-vouchers/**'
      - 'lib/cash-voucher-source.ts'
      - 'app/[locale]/opening-balances/**'
      - 'app/[locale]/financial-reports/**'
      - 'app/[locale]/financial-reporting-policy/**'
      - 'app/[locale]/chart-of-accounts/**'
      - 'components/financial-reports/**'
      - 'components/settings/**'
      - 'app/[locale]/settings/**'
      - 'services/financial-*.ts'
      - 'lib/financial-*.ts'
      - 'scripts/financial-reports/*opening*'
      - 'tests/qa-financial-opening*.sql'
      - 'tests/qa-financial-first-activity-snapshot.sql'
      - 'tests/qa-financial-production-*.sql'
      - 'tests/qa-financial-hosted-readiness.sql'
      - 'tests/financial-live-source-provenance.test.ts'
      - 'tests/qa-financial-chart-accounts.sql'
      - 'tests/qa-financial-chart-posting-rules.sql'
      - 'tests/qa-financial-chart-opening-leaf.sql'
      - 'tests/qa-financial-policy-coverage.sql'
      - '.github/workflows/financial-opening-workspace-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-full-schema-parity:
    # Applies ALL canonical migrations to a disposable local database. Nothing
    # is read from or written to any hosted Supabase project.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare entire Production schema in an isolated runner directory
        run: |
          export PARITY_QA_WORKDIR="$RUNNER_TEMP/financial-parity-qa"
          echo "PARITY_QA_WORKDIR=$PARITY_QA_WORKDIR" >> "$GITHUB_ENV"
          mkdir -p "$PARITY_QA_WORKDIR"
          npx --yes supabase@2.122.0 init --workdir "$PARITY_QA_WORKDIR"
          python - <<'PY'
          import os,pathlib,re,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'financial-parity-qa'/'supabase'
          config=root/'config.toml'
          config.write_text(re.sub(r'^project_id = .*$', 'project_id = "financial-parity-qa"', config.read_text(), flags=re.M))
          shutil.copytree('supabase/migrations',root/'migrations',dirs_exist_ok=True)
          original={p.name for p in pathlib.Path('supabase/migrations').glob('*.sql')}
          copied={p.name for p in (root/'migrations').glob('*.sql')}
          if not original or original!=copied: raise SystemExit('FULL_SCHEMA_MIGRATION_SET_MISMATCH')
          PY
      - name: Apply all migrations, including formerly excluded fiscal and branch migrations
        run: npx --yes supabase@2.122.0 start --workdir "$PARITY_QA_WORKDIR" --exclude studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta > "$RUNNER_TEMP/financial-parity-start.log" 2>&1 || { tail -80 "$RUNNER_TEMP/financial-parity-start.log"; exit 1; }
      - name: Probe read-only hosted readiness SQL against complete disposable schema
        run: |
          EVIDENCE="$(docker exec -i supabase_db_financial-parity-qa psql -X -q -A -t -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-hosted-readiness.sql)"
          EVIDENCE="$EVIDENCE" node - <<'NODE'
          const assert=require('node:assert/strict');
          const x=JSON.parse(process.env.EVIDENCE||'{}');
          assert.equal(x.gate,'BLOCKED');
          assert.equal(x.productionReady,false);
          assert.equal(x.purpose,'READ_ONLY_HOSTED_QA_PREREQUISITES_NOT_REPORT_CERTIFICATION');
          for(const property of ['branch_opening_schema','group_control_schema','legacy_cost_attestation','company_live_snapshot'])
            assert.equal(x.schema?.[property],true,'MISSING_FULL_SCHEMA_'+property);
          assert.ok(x.issues.includes('ATOMIC_AUTHENTICATED_SOURCE_AND_GROUP_UAT_NOT_CERTIFIED'));
          assert.equal(x.sourcePopulation.active_branches,0);
          assert.equal(x.sourcePopulation.approved_openings,0);
          console.log('PASS full-schema prerequisite inventory (still BLOCKED for hosted authenticated UAT)');
          NODE
      - name: Verify canonical, legacy, refund and closed-year reporting prerequisites
        run: docker exec -i supabase_db_financial-parity-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-production-parity-contract.sql
      - name: Verify exact live VAT partition amounts and source classifications
        run: docker exec -i supabase_db_financial-parity-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-production-normalized-parts.sql
      - name: Reconcile legacy asset/cash/transfer adapter against original records
        run: docker exec -i supabase_db_financial-parity-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-production-legacy-sources.sql
      - name: Prevent double-counting approved opening-consumed historical assets
        run: docker exec -i supabase_db_financial-parity-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-production-legacy-approved-opening.sql
      - name: Verify real RLS finance/asset allocation visibility mismatch without changing grants
        run: docker exec -i supabase_db_financial-parity-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-production-legacy-rls-gap.sql
      - name: Destroy isolated parity database without retaining data
        if: always()
        run: test -z "$PARITY_QA_WORKDIR" || npx --yes supabase@2.122.0 stop --workdir "$PARITY_QA_WORKDIR" --no-backup

  institutional-fiscal-and-chart-compatibility:
    # Read-only merge rehearsal for draft PR #352 + draft PR #353.
    # Nothing is pushed, deployed, or applied to any hosted database.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rehearse both institutional drafts without committing or pushing
        run: |
          git rev-parse --verify refs/remotes/origin/feat/institutional-accounting-navigation-20261104
          git -c user.name='Yaqeen QA' -c user.email='qa@users.noreply.github.com' merge --no-commit --no-ff refs/remotes/origin/feat/institutional-accounting-navigation-20261104
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify merged types, institutional navigation and accounting tests
        run: npm run check
      - name: Build combined institutional UI with isolated placeholders
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: isolated-build-placeholder
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  opening-auth-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/opening-browser" --no-package-lock --no-save playwright@1.64.1
          node "$RUNNER_TEMP/opening-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "FINANCIAL_SOURCE_BROWSER_MODULE=$RUNNER_TEMP/opening-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Prepare full canonical database in disposable target
        run: |
          export OPENING_QA_WORKDIR="$RUNNER_TEMP/opening-workspace-qa"
          echo "OPENING_QA_WORKDIR=$OPENING_QA_WORKDIR" >> "$GITHUB_ENV"
          mkdir -p "$OPENING_QA_WORKDIR"
          npx --yes supabase@2.122.0 init --workdir "$OPENING_QA_WORKDIR"
          python - <<'PY'
          import os,pathlib,re,shutil
          root=pathlib.Path(os.environ['OPENING_QA_WORKDIR'])/'supabase'
          p=root/'config.toml';s=p.read_text()
          s=re.sub(r'^project_id = .*$', 'project_id = "opening-workspace-qa"',s,flags=re.M)
          s=s.replace('enable_confirmations = true','enable_confirmations = false')
          p.write_text(s)
          shutil.copytree('supabase/migrations',root/'migrations',dirs_exist_ok=True)
          for migration in ('20261104093720_general_fiscal_opening_engine.sql',
                            '20261104113559_fiscal_future_draft_window.sql',
                            '20261104121038_organization_chart_accounts.sql',
                            '20261104124455_financial_chart_posting_rules.sql',
                            '20261104132349_financial_chart_opening_leaf_link.sql',
                            '20261104134551_financial_chart_posting_coverage.sql',
                            '20261104165205_fiscal_calendar_budget_guards.sql',
                            '20261104214000_funded_debt_source_cash_direction.sql',
                            '20261105010000_fiscal_retained_leaf_account.sql',
                            '20261105150000_equity_opening_additional_lines.sql',
                            '20261104222828_unified_cash_account_openings.sql',
                            '20261106154742_financial_group_control_evidence_v1.sql',
                            '20261107010000_financial_branch_opening_distribution.sql',
                            '20261107113000_financial_legacy_source_attestation.sql'):
            (root/'migrations'/migration).unlink()
          PY
      - name: Apply entire schema to empty local Supabase
        run: npx --yes supabase@2.122.0 start --workdir "$OPENING_QA_WORKDIR" --exclude studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta > "$RUNNER_TEMP/opening-start.log" 2>&1 || { tail -60 "$RUNNER_TEMP/opening-start.log"; exit 1; }
      - name: Upgrade existing approved legacy fixtures without changing their records or statements
        run: node scripts/financial-reports/verify-fiscal-upgrade.mjs
      - name: Verify independent fiscal budgets and immutable approved dates
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-fiscal-budget-calendar.sql
      - name: Verify audited group legal control evidence and cross-tenant isolation
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-group-control-evidence.sql
      - name: Verify versioned branch opening distribution and tenant isolation
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-branch-opening-distribution.sql
      - name: Verify zero-opening first-activity source contract with full historical and access guards
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-first-activity-snapshot.sql
      - name: Verify isolated editable chart of accounts and audit
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-chart-accounts.sql
      - name: Verify posting rules accept only active organization subaccounts
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-chart-posting-rules.sql
      - name: Verify opening leaf mapping, audit locks and one-time year-close rollup
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-chart-opening-leaf.sql
      - name: Verify complete one-to-one account mapping of every canonical source line
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-financial-policy-coverage.sql
      - name: Verify unified cash opening methods and automatic bank links
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-unified-cash-openings.sql
      - name: Verify three-bank metadata synchronization and fixed link identities
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-cash-account-link-sync.sql
      - name: Verify audited bank opening corrections and fiscal protection
        run: docker exec -i supabase_db_opening-workspace-qa psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qa-bank-opening-correction.sql
      - name: Exercise actual authorization, persistence, approval, reports and browser
        run: node scripts/financial-reports/verify-live-opening.mjs
      - name: Reconcile statements and exports against this run's approved ledger
        run: |
          cp docs/financial-reports/evidence-opening-live/qa-financial-opening-ledger.json tests/financial-reporting/qa-live-opening-snapshot.json
          npx --no-install vitest run tests/financial-opening-ledger.test.ts
      - name: Independently reconcile general fiscal closes with the statement compiler
        run: FISCAL_QA_EVIDENCE=docs/financial-reports/evidence-opening-live/qa-financial-opening-general-fiscal.json npx --no-install vitest run tests/financial-fiscal-engine.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-opening-full-schema-evidence
          path: docs/financial-reports/evidence-opening-live/
      - name: Destroy disposable database
        if: always()
        run: test -z "$OPENING_QA_WORKDIR" || npx --yes supabase@2.122.0 stop --workdir "$OPENING_QA_WORKDIR" --no-backup
