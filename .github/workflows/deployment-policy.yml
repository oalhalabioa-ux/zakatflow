name: Deployment policy gate
on:
  pull_request:
    paths:
      - "vercel.json"
      - "AGENTS.md"
      - "docs/operations/deployment-governance.md"
      - "scripts/verify-deployment-policy.mjs"
      - ".github/workflows/deployment-policy.yml"
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - "AGENTS.md"
      - "docs/operations/deployment-governance.md"
      - "scripts/verify-deployment-policy.mjs"
      - ".github/workflows/deployment-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate repository deployment governance
        run: node scripts/verify-deployment-policy.mjs
