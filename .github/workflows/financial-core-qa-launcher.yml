name: Financial Core QA Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-financial-core-qa:
    name: Run Financial Core QA Harness
    runs-on: ubuntu-latest
    environment: financial-core-qa
    env:
      QA_BRANCH: feature/auth-password-login-qa
      SUPABASE_URL: https://wtzgzmcgcqouziqzsfnl.supabase.co
      SUPABASE_PROJECT_REF: wtzgzmcgcqouziqzsfnl
      # QA publishable key stored as an encrypted Environment secret.
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
      E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
      E2E_REQUIRE_CONFIG: 'true'

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: feature/auth-password-login-qa
          persist-credentials: false

      - name: Verify QA target and log tested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$QA_BRANCH" = "feature/auth-password-login-qa"
          test "$SUPABASE_PROJECT_REF" = "wtzgzmcgcqouziqzsfnl"
          test "$SUPABASE_URL" = "https://wtzgzmcgcqouziqzsfnl.supabase.co"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          echo "Testing QA commit: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run authenticated Financial Core QA harness
        shell: bash
        run: |
          set -euo pipefail
          NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY" \
          npm run test:e2e:financial-core
