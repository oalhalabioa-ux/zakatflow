name: Financial Core Authenticated QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-financial-core:
    name: Authenticated Financial Core E2E
    runs-on: ubuntu-latest
    environment: financial-core-qa
    env:
      # QA endpoint is intentionally fixed; this workflow cannot target Production.
      NEXT_PUBLIC_SUPABASE_URL: https://wtzgzmcgcqouziqzsfnl.supabase.co
      # Store this non-secret QA publishable/anon key as an Environment variable.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
      E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
      E2E_REQUIRE_CONFIG: 'true'
      FINANCIAL_BUDGET_UI_QA: 'true'

    steps:
      - name: Verify target branch and QA endpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/auth-password-login-qa"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://wtzgzmcgcqouziqzsfnl.supabase.co"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/auth-password-login-qa
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run authenticated Financial Core QA harness
        run: npm run test:e2e:financial-core
